name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # release-please opens its release PR with GITHUB_TOKEN, which creates a
    # pull_request run that can only sit in action_required. Its output set is
    # exactly these files, so excluding them means no run is ever created.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --attach parity needs gh >= 2.99.0. Homebrew CI images lag the
      # GitHub CLI release, so this job pins an official tarball and
      # checksum rather than waiting for a brew bottle.
      - name: Install gh 2.99.0
        env:
          GH_TARBALL: gh_2.99.0_linux_amd64.tar.gz
          GH_SHA256: ed4960225d2833e04a61590d9fa2b5773d147f3aa375459e5466a40c102f3832
        run: |
          curl -fsSL -o "$GH_TARBALL" "https://github.com/cli/cli/releases/download/v2.99.0/${GH_TARBALL}"
          echo "${GH_SHA256}  ${GH_TARBALL}" | sha256sum -c -
          tar -xzf "$GH_TARBALL"
          echo "$(pwd)/gh_2.99.0_linux_amd64/bin" >> "$GITHUB_PATH"
          echo "GH_BIN=$(pwd)/gh_2.99.0_linux_amd64/bin/gh" >> "$GITHUB_ENV"

      - run: pnpm run build
      - run: pnpm test
